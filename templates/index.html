<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双目三维重建系统演示</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/daisyui/4.12.10/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .image-container {
            position: relative;
            display: inline-block;
        }
        .image-container img {
            cursor: crosshair;
            max-height: 360px;
            width: 100%;
            object-fit: contain;
        }
        .depth-info {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
        .loading {
            display: none;
        }
        .loading.active {
            display: block;
        }
    </style>
</head>
<body class="bg-base-100">
    <!-- 导航栏 -->
    <div class="navbar bg-primary text-primary-content shadow-lg">
        <div class="flex-1">
            <h1 class="text-xl font-bold">
                <i class="fas fa-eye mr-2"></i>
                双目三维重建系统演示
            </h1>
        </div>
        <div class="flex-none">
            <div class="badge badge-secondary">Python + OpenCV</div>
        </div>
    </div>

    <!-- 主要内容 -->
    <div class="container mx-auto p-4">
        <!-- 摄像头实时流 -->
        <div class="card bg-base-100 shadow-xl mb-6">
            <div class="card-body">
                <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-4">
                    <h2 class="card-title text-2xl">
                        <i class="fas fa-video mr-2"></i>
                        摄像头实时流
                    </h2>
                    <button id="captureBtn" class="btn btn-primary">
                        <i class="fas fa-camera mr-2"></i>
                        抓拍当前帧
                    </button>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div>
                        <h3 class="text-lg font-semibold text-blue-600 mb-2">实时画面</h3>
                        <div class="image-container">
                            <img id="cameraStream" class="w-full rounded-lg shadow-md border-2 border-blue-200" alt="摄像头实时画面">
                        </div>
                    </div>
                    <div>
                        <h3 class="text-lg font-semibold text-green-600 mb-2">抓拍结果</h3>
                        <div class="image-container">
                            <img id="captureImage" class="w-full rounded-lg shadow-md border-2 border-green-200" alt="抓拍图像">
                        </div>
                        <p id="captureHint" class="text-sm text-gray-500 mt-2">点击“抓拍当前帧”保存画面。</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 可按需扩展更多展示模块 -->
    </div>

    <!-- 页脚 -->
    <footer class="footer footer-center p-10 bg-base-200 text-base-content mt-16">
        <div>
            <p class="text-lg font-semibold">双目三维重建系统演示</p>
            <p>基于OpenCV和Python实现的完整双目视觉解决方案</p>
<!--            <p class="text-sm text-gray-600 mt-2">-->
<!--                来源: <a href="https://blog.csdn.net/guyuealian/article/details/121301896"-->
<!--                        class="link link-primary" target="_blank">-->
<!--                    双目三维重建系统(双目标定+立体校正+双目测距+点云显示)Python-->
<!--                </a>-->
<!--            </p>-->
        </div>
    </footer>

    <script>
        const captureBtn = document.getElementById('captureBtn');
        const cameraStream = document.getElementById('cameraStream');
        const captureImage = document.getElementById('captureImage');
        const captureHint = document.getElementById('captureHint');

        cameraStream.src = '/camera/stream';

        captureBtn.addEventListener('click', () => {
            fetch('/camera/capture', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    captureImage.src = data.image;
                    captureHint.textContent = '抓拍成功';
                } else {
                    showAlert('error', data.message);
                }
            })
            .catch(error => {
                showAlert('error', '抓拍失败: ' + error.message);
            });
        });


        // 显示提示消息
        function showAlert(type, message) {
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';

            const alertDiv = document.createElement('div');
            alertDiv.className = `alert ${alertClass} fixed top-4 right-4 w-auto max-w-md z-50`;
            alertDiv.innerHTML = `
                <i class="fas ${icon}"></i>
                <span>${message}</span>
            `;

            document.body.appendChild(alertDiv);

            // 3秒后移除提示
            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            captureHint.textContent = '点击“抓拍当前帧”保存画面。';
        });
    </script>
</body>
</html>
